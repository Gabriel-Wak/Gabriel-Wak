    />
    <path
      d="M160 98 C152 122 134 134 132 156 C130 178 144 204 160 220 C176 204 190 178 188 156 C186 134 168 122 160 98Z"
      fill="url(#flameBlue)"
    />
    <path d="M160 118 C154 136 142 146 142 164 C142 184 152 202 160 212" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <path d="M160 118 C166 136 178 146 178 164 C178 184 168 202 160 212" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    <circle cx="160" cy="168" r="5" fill="#3b82f6" opacity="0.85"/>
  </g>
</svg>
