<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="flameCore" x1="160" y1="70" x2="160" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#d1d5db"/>
      <stop offset="70%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flameBlue" x1="160" y1="120" x2="160" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="flameGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="320" rx="28" fill="#0a0a0a"/>

  <g filter="url(#flameGlow)">
